<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03 - Média Escolar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitulo {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 25px;
            text-align: center;
        }

        .grupo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.88em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3498db;
        }

        .notas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a252f;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        #resultado h2 {
            font-size: 1em;
            margin-bottom: 5px;
        }

        #resultado p {
            font-size: 0.95em;
        }

        .aprovado {
            background-color: #d6eaf8;
            color: #1a5276;
            border: 1px solid #aed6f1;
        }

        .exame {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .reprovado {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎓 Média Escolar</h1>
    <p class="subtitulo">Preencha os dados para calcular a situação do aluno</p>

    <div class="grupo">
        <label for="nomeAluno">Nome do Aluno</label>
        <input type="text" id="nomeAluno" placeholder="Ex: João da Silva">
    </div>

    <label>Notas</label>
    <div class="notas">
        <div>
            <input type="number" id="nota1" placeholder="Nota 1" min="0" max="10" step="0.1">
        </div>
        <div>
            <input type="number" id="nota2" placeholder="Nota 2" min="0" max="10" step="0.1">
        </div>
        <div>
            <input type="number" id="nota3" placeholder="Nota 3" min="0" max="10" step="0.1">
        </div>
    </div>

    <button onclick="calcularMedia()">Calcular Média</button>

    <div id="resultado"></div>
</div>

<script>
    function calcularMedia() {
        const nome = document.getElementById('nomeAluno').value.trim();
        const nota1 = Number(document.getElementById('nota1').value);
        const nota2 = Number(document.getElementById('nota2').value);
        const nota3 = Number(document.getElementById('nota3').value);
        const resultado = document.getElementById('resultado');

        if (nome === '') {
            alert('Por favor, informe o nome do aluno.');
            return;
        }

        const media = (nota1 + nota2 + nota3) / 3;
        resultado.style.display = 'block';

        if (media >= 7.0) {
            resultado.className = 'aprovado';
            resultado.innerHTML = `
                <h2>✅ ${nome} foi Aprovado(a)!</h2>
                <p>Média final: <strong>${media.toFixed(2)}</strong></p>
            `;
        } else if (media >= 4.0) {
            const faltando = (10 - media).toFixed(2);
            resultado.className = 'exame';
            resultado.innerHTML = `
                <h2>⚠️ ${nome} está em Exame!</h2>
                <p>Média final: <strong>${media.toFixed(2)}</strong></p>
                <p>Faltam <strong>${faltando}</strong> pontos para atingir 10.</p>
            `;
        } else {
            resultado.className = 'reprovado';
            resultado.innerHTML = `
                <h2>❌ ${nome} foi Reprovado(a)!</h2>
                <p>Média final: <strong>${media.toFixed(2)}</strong></p>
            `;
        }
    }
</script>

</body>
</html>
