<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04 - Infinity Bank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 460px;
            border: 1px solid #0f3460;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 1.5em;
            color: #e2b04a;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 0.85em;
            color: #7f8c8d;
        }

        .grupo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: #a0aec0;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            background-color: #0f3460;
            color: #fff;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus,
        select:focus {
            border-color: #e2b04a;
        }

        select option {
            background-color: #16213e;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #e2b04a;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c9922e;
        }

        #resultado {
            margin-top: 25px;
            display: none;
        }

        .divider {
            border: none;
            border-top: 1px solid #0f3460;
            margin: 15px 0;
        }

        .linha {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .linha span:first-child {
            color: #a0aec0;
        }

        .linha span:last-child {
            color: #fff;
            font-weight: 600;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 1.05em;
            margin-top: 5px;
        }

        .total span:first-child {
            color: #e2b04a;
            font-weight: bold;
        }

        .total span:last-child {
            color: #e2b04a;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>💳 Infinity Bank</h1>
        <p>Simulador de Taxas e Parcelamentos</p>
    </div>

    <div class="grupo">
        <label for="bandeira">Bandeira do Cartão</label>
        <select id="bandeira">
            <option value="">Selecione...</option>
            <option value="visa">Visa (2%)</option>
            <option value="master">Mastercard (1,85%)</option>
            <option value="elo">Elo (3%)</option>
        </select>
    </div>

    <div class="grupo">
        <label for="valor">Valor da Venda (R$)</label>
        <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
    </div>

    <div class="grupo">
        <label for="parcelas">Número de Parcelas</label>
        <input type="number" id="parcelas" placeholder="1" min="1" max="12">
    </div>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado">
        <hr class="divider">
        <div class="linha">
            <span>Valor da Venda</span>
            <span id="exibValor">—</span>
        </div>
        <div class="linha">
            <span>Taxa da Bandeira</span>
            <span id="exibTaxa">—</span>
        </div>
        <div class="linha">
            <span>Juros Totais</span>
            <span id="exibJuros">—</span>
        </div>
        <div class="linha">
            <span>Taxa Mensal (R$ 12,50/mês)</span>
            <span id="exibTaxaMensal">—</span>
        </div>
        <hr class="divider">
        <div class="total">
            <span>Valor Total</span>
            <span id="exibTotal">—</span>
        </div>
        <hr class="divider">
        <div class="total">
            <span>Valor por Parcela</span>
            <span id="exibParcela">—</span>
        </div>
    </div>
</div>

<script>
    function calcular() {
        const bandeira = document.getElementById('bandeira').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const parcelas = parseInt(document.getElementById('parcelas').value);

        if (!bandeira || isNaN(valor) || isNaN(parcelas) || valor <= 0 || parcelas < 1) {
            alert('Preencha todos os campos corretamente.');
            return;
        }

        // Taxa da bandeira usando switch
        let taxaBandeira = 0;
        switch (bandeira) {
            case 'visa':
                taxaBandeira = 0.02;
                break;
            case 'master':
                taxaBandeira = 0.0185;
                break;
            case 'elo':
                taxaBandeira = 0.03;
                break;
        }

        const valorTaxa = valor * taxaBandeira;
        const juros = valor * (0.015 * parcelas); // Juros simples de 0.35% ao mês por parcela (0.015 total por parcela conforme fórmula do exercício)
        const taxaMensal = 12.50 * parcelas;
        const valorTotal = valor + valorTaxa + juros + taxaMensal;
        const valorParcela = valorTotal / parcelas;

        // Exibe o resultado
        document.getElementById('exibValor').textContent = 'R$ ' + valor.toFixed(2);
        document.getElementById('exibTaxa').textContent = 'R$ ' + valorTaxa.toFixed(2);
        document.getElementById('exibJuros').textContent = 'R$ ' + juros.toFixed(2);
        document.getElementById('exibTaxaMensal').textContent = 'R$ ' + taxaMensal.toFixed(2);
        document.getElementById('exibTotal').textContent = 'R$ ' + valorTotal.toFixed(2);
        document.getElementById('exibParcela').textContent = 'R$ ' + valorParcela.toFixed(2);

        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
