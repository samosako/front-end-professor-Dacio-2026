<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05 - Convidados VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 520px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h1 {
            font-size: 1.3em;
            color: #2c3e50;
        }

        .card-header p {
            font-size: 0.88em;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .adicionar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .adicionar input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.2s;
        }

        .adicionar input:focus {
            border-color: #2c3e50;
        }

        .adicionar button {
            padding: 10px 18px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .adicionar button:hover {
            background-color: #1a252f;
        }

        #contador {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        #listaConvidados {
            list-style: none;
            padding: 0;
        }

        #listaConvidados li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 10px;
        }

        #listaConvidados li:last-child {
            border-bottom: none;
        }

        .nome-convidado {
            flex: 1;
            font-size: 0.95em;
            color: #2c3e50;
            transition: all 0.2s;
        }

        .nome-convidado.presente {
            text-decoration: line-through;
            color: #bdc3c7;
        }

        .acoes {
            display: flex;
            gap: 6px;
        }

        .acoes button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            font-size: 0.8em;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .acoes button:hover {
            opacity: 0.8;
        }

        .btn-concluir {
            background-color: #27ae60;
            color: white;
        }

        .btn-editar {
            background-color: #f39c12;
            color: white;
        }

        .btn-excluir {
            background-color: #e74c3c;
            color: white;
        }

        .lista-vazia {
            text-align: center;
            padding: 30px 0;
            color: #bdc3c7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h1>👥 Infinity Bank</h1>
        <p>Lista de Convidados VIP — Noite de Inauguração</p>
    </div>

    <div class="adicionar">
        <input type="text" id="campoNome" placeholder="Nome do convidado...">
        <button onclick="adicionarConvidado()">+ Adicionar</button>
    </div>

    <div id="contador">Nenhum convidado adicionado</div>
    <ul id="listaConvidados">
        <li class="lista-vazia" id="msgVazia">A lista está vazia.</li>
    </ul>
</div>

<script>
    // Array para guardar os convidados
    let convidados = [];

    // Permite adicionar com Enter
    document.getElementById('campoNome').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            adicionarConvidado();
        }
    });

    function adicionarConvidado() {
        const campo = document.getElementById('campoNome');
        const nome = campo.value.trim();

        if (nome === '') {
            alert('Digite o nome do convidado!');
            return;
        }

        // Adiciona ao array com estado de presença
        convidados.push({ nome: nome, presente: false });
        campo.value = '';
        renderizarLista();
    }

    function concluirConvidado(index) {
        convidados[index].presente = !convidados[index].presente;
        renderizarLista();
    }

    function editarConvidado(index) {
        const novoNome = prompt('Novo nome:', convidados[index].nome);
        if (novoNome !== null && novoNome.trim() !== '') {
            convidados[index].nome = novoNome.trim();
            renderizarLista();
        }
    }

    function excluirConvidado(index) {
        if (confirm('Remover ' + convidados[index].nome + ' da lista?')) {
            convidados.splice(index, 1);
            renderizarLista();
        }
    }

    function renderizarLista() {
        const lista = document.getElementById('listaConvidados');
        const contador = document.getElementById('contador');

        lista.innerHTML = '';

        if (convidados.length === 0) {
            lista.innerHTML = '<li class="lista-vazia">A lista está vazia.</li>';
            contador.textContent = 'Nenhum convidado adicionado';
            return;
        }

        const presentes = convidados.filter(c => c.presente).length;
        contador.textContent = `${convidados.length} convidado(s) — ${presentes} presente(s)`;

        convidados.forEach(function(convidado, index) {
            const li = document.createElement('li');

            const nomeSpan = document.createElement('span');
            nomeSpan.className = 'nome-convidado' + (convidado.presente ? ' presente' : '');
            nomeSpan.textContent = convidado.nome;

            const acoes = document.createElement('div');
            acoes.className = 'acoes';

            const btnConcluir = document.createElement('button');
            btnConcluir.className = 'btn-concluir';
            btnConcluir.textContent = convidado.presente ? 'Desfazer' : 'Concluir';
            btnConcluir.onclick = function() { concluirConvidado(index); };

            const btnEditar = document.createElement('button');
            btnEditar.className = 'btn-editar';
            btnEditar.textContent = 'Editar';
            btnEditar.onclick = function() { editarConvidado(index); };

            const btnExcluir = document.createElement('button');
            btnExcluir.className = 'btn-excluir';
            btnExcluir.textContent = 'Excluir';
            btnExcluir.onclick = function() { excluirConvidado(index); };

            acoes.appendChild(btnConcluir);
            acoes.appendChild(btnEditar);
            acoes.appendChild(btnExcluir);

            li.appendChild(nomeSpan);
            li.appendChild(acoes);
            lista.appendChild(li);
        });
    }
</script>

</body>
</html>
