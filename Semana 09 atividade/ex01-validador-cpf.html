<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 - Validador de CPF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a252f;
        }

        #resultado {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            display: none;
        }

        .valido {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .invalido {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Validador de CPF</h1>
    <p>Digite o CPF para verificar se é válido</p>

    <input type="text" id="campoCPF" placeholder="000.000.000-00" maxlength="14">
    <button onclick="validarCPF()">Validar</button>

    <div id="resultado"></div>
</div>

<script>
    // Formata o CPF enquanto digita
    document.getElementById('campoCPF').addEventListener('input', function() {
        let valor = this.value.replace(/\D/g, '');
        if (valor.length <= 11) {
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }
        this.value = valor;
    });

    function validarCPF() {
        const campo = document.getElementById('campoCPF');
        const resultado = document.getElementById('resultado');

        // Remove pontos e traço
        const cpf = campo.value.replace(/\D/g, '');

        resultado.style.display = 'block';

        // Checa se tem 11 dígitos ou se todos os números são iguais
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) {
            resultado.className = 'invalido';
            resultado.textContent = '❌ CPF Inválido!';
            return;
        }

        // Cálculo do primeiro dígito verificador
        let soma = 0;
        for (let i = 0; i < 9; i++) {
            soma += parseInt(cpf[i]) * (10 - i);
        }
        let resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;

        if (resto !== parseInt(cpf[9])) {
            resultado.className = 'invalido';
            resultado.textContent = '❌ CPF Inválido!';
            return;
        }

        // Cálculo do segundo dígito verificador
        soma = 0;
        for (let i = 0; i < 10; i++) {
            soma += parseInt(cpf[i]) * (11 - i);
        }
        resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;

        if (resto !== parseInt(cpf[10])) {
            resultado.className = 'invalido';
            resultado.textContent = '❌ CPF Inválido!';
            return;
        }

        resultado.className = 'valido';
        resultado.textContent = '✅ CPF Válido!';
    }
</script>

</body>
</html>
